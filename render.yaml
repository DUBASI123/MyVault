# MyVault Backend — Render Deploy Config
# Set these env vars in Render Dashboard → Environment

services:
  - type: web
    name: myvault-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false   # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false   # Set manually in Render dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false   # Set manually in Render dashboard
      - key: AWS_BUCKET_NAME
        value: myvault-study-materials
      - key: CORS_ORIGIN
        value: "*"
