services:
  # 1. NestJS REST API Server & APK Download Host
  - type: web
    name: myvault-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: UTC
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

  # 2. stuvault-cms Web Console Static Site
  - type: web
    name: stuvault-cms
    runtime: static
    region: singapore
    rootDir: stuvault-cms
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://facqwktjfalukazexjye.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
