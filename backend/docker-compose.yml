version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myvault_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secret@postgres:5432/myvault_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=myvault_production_jwt_secret_key_2026
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: myvault_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
      POSTGRES_DB: myvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: myvault_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: myvault_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
